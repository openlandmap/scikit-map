[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel", "cmake>=3.22"]

[project]
description = "scikit-learn applied to mapping and spatial prediction"
name = "scikit-map"
readme = "README.md" # Assuming your long_description content is in a README.md
requires-python = ">=3.7"
version = "0.9.1"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Leandro Parente", email = "leandro.parente@opengeohub.org" },
  { name = "Davide Consoli", email = "info@davide-consoli.com" },
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "affine>=2.4.0",
  "geopandas>=0.13.2",
  "joblib>=1.3.2",
  "numpy>=1.24.3",
  "pandas>=2.0.2",
  "requests>=2.31.0",
  "scikit-learn>=1.3.2",
  "rasterio>=1.3.6",
  "cmake>=3.15",
  "minio>=7.1.5",
  "tomli>=2.0.1",
  "PyYAML>=6.0",
  "gspread>=5.3.2",
]

[project.urls]
Homepage = "https://github.com/scikit-map/scikit-map"
Repository = "https://github.com/scikit-map/scikit-map"

[project.optional-dependencies]
full = [
  "Bottleneck>=1.3",
  "matplotlib>=3.7.3",
  "pqdm>=0.1",
  "pystac>=1.4.0",
  "pyts>=0.11",
  "pyfftw>=0.13",
  "scikit_image>=0.20",
  "Shapely>=1.7",
  "whoosh>=2.7.4",
]

[tool.setuptools.packages.find]
include = ["skmap*"]
where = ["."]
