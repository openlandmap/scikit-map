[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel", "cmake>=3.22"]

[project]
name = "scikit-map"
version = "0.9.2"
description = "scikit-learn applied to mapping and spatial prediction"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

authors = [
  { name = "Leandro Parente", email = "leandro.parente@opengeohub.org" },
  { name = "Davide Consoli", email = "info@davide-consoli.com" },
]

classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/scikit-map/scikit-map"
Repository = "https://github.com/scikit-map/scikit-map"

[project.optional-dependencies]
full = [
  "Bottleneck>=1.3",
  "matplotlib>=3.7.3",
  "pqdm>=0.1",
  "pystac>=1.4.0",
  "pyts>=0.11",
  "pyfftw>=0.13",
  "scikit_image>=0.20",
  "Shapely>=1.7",
  "whoosh>=2.7.4",
  "tl2cgen>=1.0.0",
  "h5py>=3.8.0",
  "numexpr",
  "psutil",
  "statsmodels",
]
dev = [
  "pytest",
  "pytest-cov",
  "ipython",
  "ruff",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "pydata-sphinx-theme",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "pydata-sphinx-theme",
  "nbsphinx",
  "jupytext",
  "jupyter",
  "matplotlib",
  "numpy",
  "numpydoc",
  "breathe",
]

[tool.setuptools.packages.find]
include = ["skmap*"]
where = ["."]

[tool.ruff.lint]
extend-select = ["ANN", "I"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
