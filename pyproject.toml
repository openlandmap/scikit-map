[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel", "cmake>=3.22"]

[project]
name = "scikit-map"
version = "0.9.1"
description = "scikit-learn applied to mapping and spatial prediction"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

authors = [
  { name = "Leandro Parente", email = "leandro.parente@opengeohub.org" },
  { name = "Davide Consoli", email = "info@davide-consoli.com" },
]

classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/scikit-map/scikit-map"
Repository = "https://github.com/scikit-map/scikit-map"

[project.optional-dependencies]
full = [
  "Bottleneck>=1.3",
  "matplotlib>=3.7.3",
  "pqdm>=0.1",
  "pystac>=1.4.0",
  "pyts>=0.11",
  "pyfftw>=0.13",
  "scikit_image>=0.20",
  "Shapely>=1.7",
  "whoosh>=2.7.4",
]

[tool.setuptools.packages.find]
include = ["skmap*"]
where = ["."]
