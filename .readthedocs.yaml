# https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv

version: 2

sphinx:
   configuration: docs/conf.py

build:
   os: ubuntu-24.04
   apt_packages:
      - libproj-dev
      - libgeos-dev
      - gdal-bin
      - libgdal-dev
   tools:
      python: "3.13"
   jobs:
      pre_create_environment:
         - asdf plugin add uv
         - asdf install uv latest
         - asdf global uv latest
      create_environment:
         - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
      install:
         - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv pip install .[full] -r docs/requirements.txt

