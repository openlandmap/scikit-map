name: PyTest

on:
  push:
    paths:
     - '.github/workflows/pytest.yaml'
     - 'skmap/**'
     - 'tests/**'
     - 'CMakeLists.txt'
     - 'setup.py'
     - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev libgeos-dev gdal-bin libgdal-dev
          gdal-config --version
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
      - name: install with python ${{ matrix.python-version }}
        run: |
          gdal-config --version
          uv pip install .[full,dev]
          . .venv/bin/activate
      - name: Build and run C++ unit tests (same bindings as Python)
        run: |
          cmake -B build -DTESTS=1 -DSKMAP_EXPECTED_GDAL_VERSION=$(gdal-config --version) .
          cmake --build build -j
          ./build/tests/src/unit_tests
      - name: Run format and tests
        run: |
          ruff format --check
          pytest --cov=skmap --cov-report=xml
